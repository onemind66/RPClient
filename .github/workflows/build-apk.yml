name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" -print -quit | grep -q .
          cp app/build/outputs/apk/debug/*.apk build-artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPClient-debug-apk-${{ github.run_number }}
          path: build-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

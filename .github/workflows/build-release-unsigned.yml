name: Build Unsigned Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify and stage unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::No unsigned release APK was produced"
            exit 1
          fi
          cp "$apk" build-artifacts/RPClient-release-unsigned.apk
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: RPClient-release-unsigned-${{ github.run_number }}
          path: build-artifacts/RPClient-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
